# ~/llama-swap-config.yaml

# Automatically unload models after 30 minutes (1800 seconds) of inactivity
globalTTL: 1800

# Start assigning ports from 12390 (llama-server instances)
startPort: 12390

# Optional hardware monitoring: samples GPUs (0-N), CPU, RAM and NVMe
# devices every `interval`, writes JSONL logs to `logDir` (one file per
# day, old files deleted after `retentionDays`) and serves
# GET /llama-swappy/monitor. Absent or enabled: false means no hardware
# access at all. logDir is optional: without it the endpoint still
# serves live data, but nothing is written to disk.
#monitor:
#  enabled: true
#  logDir: /var/log/llama-swappy
#  interval: 5s
#  retentionDays: 7

# Optional idle poweroff: after the last loaded model has been unloaded,
# wait `idleSeconds` without any model loaded, check that it is safe to
# power off (on Linux: no ssh sessions, screen or tmux instances) and
# run the poweroff command. Counting starts only after the first model
# load and its subsequent unload; an unsafe system restarts the full
# countdown; a failed command stops counting permanently (until the next
# start). Absent or enabled: false means the system is never powered off.
#poweroff:
#  enabled: true
#  idleSeconds: 3600
#  # command: /usr/bin/systemctl poweroff   # default on Linux; required elsewhere

models:
  qwen3.8-27b:
    name: "Qwen3.8-27B"
    # Linux: 'env' sets the variable, and the script uses ${PORT:-12380}
    cmd: env PORT=${PORT} /home/yury/run_qwen3.8-27b.sh
    # Windows: the script declares param([int]$Port) and receives the port
    # as -Port ${PORT}
    # cmd: powershell -NoProfile -ExecutionPolicy Bypass -File C:\run\run_qwen3.8-27b.ps1 -Port ${PORT}
    proxy: http://127.0.0.1:${PORT}

  ornith-1.5-9b:
    name: "Ornith 1.5 9B"
    cmd: env PORT=${PORT} /home/yury/run_ornith_1.5_9B.sh
    proxy: http://127.0.0.1:${PORT}

  ornith-1.5-9b-np4:
    name: "Ornith 1.5 9B (np4)"
    cmd: env PORT=${PORT} /home/yury/run_ornith_1.5_9B_np4.sh
    proxy: http://127.0.0.1:${PORT}

  swift-1.5-qwen3.8-27b:
    name: "Swift 1.5 Qwen3.8-27B"
    cmd: env PORT=${PORT} /home/yury/run_swift-1.5-qwen3.8-27b.sh
    proxy: http://127.0.0.1:${PORT}
